trigger:
  branches:
    include:
      - dev
      - prod
parameters:
  - name: BRANCH
    displayName: 'Branch'
    type: string
    default: prod
    values:
      - dev
      - prod

pool:
  name: vm-race-pool

jobs:
  - job: Deploy
    displayName: 'FE Deployment - race_ai'
    steps:
      - checkout: self
        clean: 'true'

      - script: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          if [[ "$COMMIT_MSG" != deploy* ]]; then
            echo "Skipping deployment — commit message does not start with 'deploy'"
            echo "##vso[task.complete result=Skipped;]Skipped"
            exit 0
          fi

          echo "Deploy keyword detected — proceeding..."
        displayName: 'Check Commit Message'

      - script: |
          set -e
          set -x
          echo "=== FE Deployment Started: $(date) ==="

          # Auto-detect branch from push, fallback to manual parameter
          TRIGGER_BRANCH="${BUILD_SOURCEBRANCH##refs/heads/}"
          if [ "$TRIGGER_BRANCH" = "dev" ] || [ "$TRIGGER_BRANCH" = "prod" ]; then
            BRANCH="$TRIGGER_BRANCH"
          else
            BRANCH="${{ parameters.BRANCH }}"
          fi

          echo "Deploying branch: $BRANCH"

          if [ "$BRANCH" = "dev" ]; then
            cp /app/apps/assortment/rationalization/fc_app/assortment_l_fc_dev/Dockerfile $(Build.SourcesDirectory)/
            cp /app/apps/assortment/rationalization/fc_app/assortment_l_fc_dev/.env $(Build.SourcesDirectory)/
            IMAGE_NAME="assortment_r_fc_dev_1"
          else
            cp /app/apps/race-ai/fc_app/race_ai/Dockerfile $(Build.SourcesDirectory)/
            cp /app/apps/race-ai/fc_app/race_ai/.env $(Build.SourcesDirectory)/
            IMAGE_NAME="race_ai_prod_7"
          fi

          OLD_CONTAINER=$(docker ps -q --filter "ancestor=$IMAGE_NAME")
          if [ ! -z "$OLD_CONTAINER" ]; then
            echo "Stopping old container: $OLD_CONTAINER"
            docker stop $OLD_CONTAINER
            docker rm $OLD_CONTAINER
          fi

          docker build -t $IMAGE_NAME $(Build.SourcesDirectory)
          docker run --network=host -itd $IMAGE_NAME

          echo "=== FE Deployment Done: $(date) ==="
        displayName: 'Build & Deploy'
